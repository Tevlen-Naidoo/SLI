<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Important Question!</title>
		<link rel="icon" type="image/x-icon" href="./assets/heart.ico">
		<link href="css/style.css" rel="stylesheet">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Yuyu&display=swap" rel="stylesheet">
	</head>
	<body>
		<section id="intro">
			<p>Ready?</p>
			<section class="choices">
				<button type="button">Ready as I'll ever be</button>
				<button type="button">Fuck it</button>
			</section>
		</section>
		<section id="question" class="choices hidden">
			<button type="button" id="answer-yes">Yes</button>
			<button type="button" id="answer-no">No</button>
		</section>
		<dialog id="no-popup">
			<p></p>
			<section class="choices">
				<button type="button" autofocus>Okay</button>
			</section>
		</dialog>
		<canvas id="background"></canvas>
		<audio loop id="song" src="./assets/combined.mp3" preload="auto"></audio>
		<script type="module" src="./scripts/background.js"></script>
	</body>
</html>
